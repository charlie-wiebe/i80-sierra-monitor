<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-80 Sierra Monitor — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5; display: flex; align-items: center;
            justify-content: center; min-height: 100vh;
        }
        .login-card {
            background: white; border-radius: 12px; padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%;
            max-width: 380px; text-align: center;
        }
        .login-card h1 { font-size: 1.4rem; margin-bottom: 6px; color: #1a3a5c; }
        .login-card p { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
        input[type="password"] {
            width: 100%; padding: 12px 16px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 1rem; margin-bottom: 16px;
            outline: none; transition: border 0.2s;
        }
        input[type="password"]:focus { border-color: #2d6a9f; }
        .btn {
            width: 100%; padding: 12px; background: #1a3a5c; color: white;
            border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #2d6a9f; }
        .error { color: #c62828; font-size: 0.9rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>I-80 Sierra Monitor</h1>
        <p>Enter the site password to continue</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Password" autofocus>
            <button type="submit" class="btn">Log In</button>
        </form>
    </div>
</body>
</html>
